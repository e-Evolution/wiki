name: diag-b-deploy-full
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docmd-io/deploy@v1
        id: docmd-deploy
      - name: Add CNAME to Pages artifact
        if: hashFiles('CNAME') != ''
        run: cp CNAME "${{ steps.docmd-deploy.outputs.site-dir }}/CNAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docmd-deploy.outputs.site-dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
