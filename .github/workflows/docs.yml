name: docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # NOTE: a job-level `if: hashFiles(...)` guard was removed — on this
    # account it makes the whole run fail before any job starts (verified
    # with a diagnostic matrix, 2026-09-04). The guard was a no-op guard for
    # pre-content main (WU0.4 era); docs/ is permanent content from WU0.5 on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (fail on any build error)
        run: npx @docmd/core build
      - name: Link validation (MCP validate_docs)
        run: node scripts/ci/ci-validate.mjs .
      - name: Image reference check
        run: node scripts/ci/check-images.mjs docs assets

  deploy:
    needs: gate
    # Deploy only on main and only once both content and assets have landed
    # (WU0.5/WU0.6), so the Pages subpath never serves a partial site.
    # (assets/img hashFiles guard removed for the same reason as above.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docmd-io/deploy@v1
        id: docmd-deploy
      # docmd 0.9.4 does not copy a CNAME into the build output; GitHub Pages
      # reads it from the artifact root. Cutover commit (WU3.1).
      # NOTE (2026-09-04, updated 2026-09-05): the site is published on the
      # subpath e-evolution.github.io/wiki for now (owner decision); the CNAME
      # file is therefore absent from the repo and this step is a no-op. The
      # eventual custom domain is docs.adeos.business (owner, 2026-09-05);
      # docs.erpya.com stays on the old VuePress site and is not claimed here.
      # To enable the custom domain later, in that order: re-add CNAME
      # (docs.adeos.business) + flip config url + create the DNS CNAME
      # docs.adeos.business -> e-evolution.github.io.
      - name: Add CNAME to Pages artifact
        if: hashFiles('CNAME') != ''
        run: cp CNAME "${{ steps.docmd-deploy.outputs.site-dir }}/CNAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.docmd-deploy.outputs.site-dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
