# OpenSpec configuration — SDD artifact store for project "wiki"
# Generated by sdd-init (2026-09-02). Safe to extend; phase agents read this
# file for stack, verification, and convention context.
project: wiki
artifact_store: openspec
active_change: migrate-erpya-docs-to-docmd

project_context:
  description: >
    ERP documentation site migrating content from ERPya (docs.erpya.com;
    source repo: github.com/erpcya/docs, VuePress 2.0.0-beta.68 +
    vuepress-theme-hope 2.0.0-beta.252) to docmd.io. This repo is the new
    home of the migrated site; the original erpcya/docs repo stays untouched
    (content is imported here as the base). Prior background:
    docs-platform-evaluation.md (Spanish platform evaluation report).

stack:
  site_generator:
    name: docmd
    package: "@docmd/core"
    version: "0.9.4"
    license: MIT
    cli: "npx @docmd/core"
  runtime:
    node: "v26.7.0 (docmd requires Node 20+)"
  content:
    format: markdown
    origin: "VuePress markdown from erpcya/docs; may need adaptation to docmd conventions during migration"
  deployment:
    target: "GitHub Pages"
    method: "docmd official GitHub Action"

product_constraints:
  - "Phased migration: pilot with 1-2 representative modules, then rollout by module, then cutover."
  - "Migrated site materializes in THIS repo; original erpcya/docs repo stays untouched (content imported as base)."
  - "Production deployment: GitHub Pages via the docmd official GitHub Action."
  - "Parallel version publishing required: docmd versioning active from the pilot."
  - "Content locale: es (single locale initially, i18n-ready structure)."
  - "docmd plugins enabled from the pilot: search, llms (llms.txt/llms-full.txt/SKILL.md), mcp."

testing:
  strict_tdd: false
  reason: >
    Documentation project with no unit test runner. Verification is a
    reproducible production build plus content validity (links/images)
    checks, not unit tests. strict_tdd must not be enabled for this project.
  test_command: null
  verification:
    build:
      command: "npx @docmd/core build"
      role: "Primary verification gate: reproducible full-site build per migration slice and before cutover."
    links_images:
      command: "npx @docmd/core build (inspect link/image warnings in output)"
      role: "Link and image validity checks run as part of the build; CI should treat broken links/images as failures."
    ci:
      description: >
        GitHub Actions: docmd build on every PR (fail on link/image
        validity errors) + docmd official GitHub Action deploying to
        GitHub Pages on main.

phase_rules:
  - "Each migration slice is verified by a clean `npx @docmd/core build` plus link/image validity; no unit tests exist."
  - "The pilot slice (1-2 modules) must have search, llms, and mcp plugins plus docmd versioning active before rollout starts."
  - "Never modify the original erpcya/docs repo; all content changes happen in this repo."
  - "No git commits are made by sdd-init; commits are owned by the apply phase as reviewable work units."

conventions:
  language: "Documentation content is Spanish (es). Generated artifacts, config files, and commit messages are English."
  markdown: "Canonical Markdown in Git; follow docmd conventions and structure."
  i18n: "Single locale (es) initially, but keep the structure i18n-ready."
  versions: "Docmd versioning active from the pilot; parallel version publishing is required."
  images: "Images/screenshots live in-repo under the content tree; every image must resolve at build time."
